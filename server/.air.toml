root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/market-lens ./cmd/market-lens"
  bin = "./tmp/market-lens"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[misc]
  clean_on_exit = true
