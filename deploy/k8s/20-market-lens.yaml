apiVersion: v1
kind: ConfigMap
metadata:
  name: market-lens-config
  namespace: market-lens
data:
  ENV: production
  PORT: "8080"
  STATIC_DIR: /app/web
  ALLOWED_ORIGINS: "https://${APP_HOST}"
  AUTH_SECURE_COOKIES: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: market-lens
  namespace: market-lens
spec:
  selector:
    app.kubernetes.io/name: market-lens
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-lens
  namespace: market-lens
  annotations:
    # The GHCR package is public. Keel polls the mutable tag's digest and forces
    # a rollout when a tested main-branch image replaces it.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 2m"
spec:
  replicas: 1
  strategy:
    # Avoid concurrent startup migrations. A future high-availability spec can
    # introduce migration coordination before enabling overlapping replicas.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: market-lens
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-lens
    spec:
      securityContext:
        runAsNonRoot: true
        # The published Alpine image creates marketlens as uid 100 / gid 101.
        # Numeric IDs let kubelet verify the non-root policy before startup.
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: market-lens
          image: ghcr.io/zuptalo/market-lens:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: market-lens-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: market-lens-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: market-lens-secrets
                  key: AUTH_SECRET
            - name: EXTERNAL_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: market-lens-secrets
                  key: EXTERNAL_CREDENTIAL_KEY
            - name: EXTERNAL_CREDENTIAL_KEY_VERSION
              valueFrom:
                secretKeyRef:
                  name: market-lens-secrets
                  key: EXTERNAL_CREDENTIAL_KEY_VERSION
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
