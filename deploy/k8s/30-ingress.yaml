# Traefik redirects public HTTP, then terminates TLS for the HTTP-only Market Lens
# container. The resolver configured by 05-traefik-acme.yaml uses TLS-ALPN-01.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: market-lens-https-redirect
  namespace: market-lens
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-lens-http
  namespace: market-lens
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: market-lens-market-lens-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ${APP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: market-lens
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-lens-https
  namespace: market-lens
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${APP_HOST}
  rules:
    - host: ${APP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: market-lens
                port:
                  name: http
