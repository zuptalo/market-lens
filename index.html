<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page reach under a phone's rounded corners and home indicator;
      the shell pays that back with safe-area padding. Zoom stays available here and is locked only
      once the app is installed - see src/utils/viewport.ts for why the two differ.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Market Lens" />
    <!--
      use-credentials because this deployment answers 401 for every path without a session. A
      manifest link is fetched without credentials by default, so the browser would get the 401,
      conclude there is no manifest, and refuse to install the app - while every other request on
      the page succeeded, because those carry the cookie.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Market Lens</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
