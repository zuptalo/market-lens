name: Market Lens CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-lens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BRANCH: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release policy scripts
        run: scripts/release-version.test.sh
      - name: Validate pull request branch and title
        if: env.EVENT_NAME == 'pull_request'
        run: |
          scripts/release-version.sh validate-branch "$PR_BRANCH"
          scripts/release-version.sh bump "$PR_TITLE"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit:coverage

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    name: Container validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose config
      - name: Validate k3s deployment contract
        run: deploy/k8s/test.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: VERSION=dev
          cache-from: type=gha,scope=market-lens-image
          cache-to: type=gha,mode=max,scope=market-lens-image

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [policy, frontend, backend, e2e, container]
    runs-on: ubuntu-latest
    env:
      POLICY_RESULT: ${{ needs.policy.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - name: Require every validation job
        run: |
          for result in "$POLICY_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT" "$E2E_RESULT" "$CONTAINER_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "required validation result was $result" >&2
              exit 1
            fi
          done
