openapi: 3.1.0
info:
  title: Market Lens Market Data Navigation API
  version: 1.0.0
  description: >
    Additions for feature 014. The instrument listing reports how many instruments match the
    filter so a continuously scrolling reader knows where they are; the sector vocabulary is
    served so the filter can offer only choices that exist; and the feature engine's runs
    become readable so an operational screen can report them. Everything here is shared
    reference or operational data behind the authenticated boundary of feature 004. Nothing
    here is private to a user and nothing here writes.
servers:
  - url: /api/v1
x-market-lens-access-boundary:
  authenticated:
    - /instruments
    - /instruments/sectors
    - /feature-runs
  rule: >
    Every operation requires an active session and is refused to a deactivated account.
    Nothing here is scoped to a user, so no operation may vary its answer by caller identity.

paths:
  /instruments:
    get:
      summary: List the curated universe, with the size of the filtered result set
      description: >
        Unchanged except for `total`. Keyset pagination is retained: a page is bounded by
        `cursor` and `limit`, and neither repeats nor skips a row while the data changes.
        `total` is returned only when the request carries no cursor, because counting the
        filtered set on every page would defeat the early termination that makes a keyset page
        cheap. A client holds the total it received with the first page and refreshes it by
        issuing another cursor-less request.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: mic
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: sector
          in: query
          description: A sector code from /instruments/sectors. An unknown code is rejected.
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, ticker, exchange, sector, country, latest_close, change_percent, return_20, return_90, volatility, freshness]
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of the filtered universe
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ListingRow" }
                  next_cursor:
                    type: [string, "null"]
                    description: Absent when this page is the last.
                  total:
                    type: [integer, "null"]
                    description: >
                      Instruments matching the filter, ignoring the page limit. Present when
                      the request carried no cursor; null otherwise. Null means "unchanged",
                      never "zero".
              examples:
                firstPage:
                  value:
                    items: []
                    next_cursor: "eyJ2IjoiQUJCIn0"
                    total: 342
                laterPage:
                  value:
                    items: []
                    next_cursor: null
                    total: null
        "400":
          description: Unsupported sort, unknown sector code, or malformed cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No active session

  /instruments/sectors:
    get:
      summary: The sector classification vocabulary
      description: >
        The closed set of sector values, in display order, including the explicit
        `unclassified` member. The client renders its filter from this rather than from a
        list of its own, so a filter choice can never fail to exist in the data.
      responses:
        "200":
          description: The vocabulary
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Sector" }
              example:
                items:
                  - { code: "health_care", name: "Health Care", instrument_count: 12 }
                  - { code: "unclassified", name: "Unclassified", instrument_count: 0 }
        "401":
          description: No active session

  /feature-runs:
    get:
      summary: Recent feature engine runs
      description: >
        The engine's runs, most recent first, so an operational screen can report whether the
        statistics on the market screens were recomputed after the last import — and whether
        the computation failed. Read-only: computation is triggered by an owner through the
        command line, never over HTTP.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeatureRun" }
        "401":
          description: No active session

components:
  schemas:
    Sector:
      type: object
      required: [code, name, instrument_count]
      properties:
        code:
          type: string
          description: Stable identifier used by the listing's sector filter.
        name:
          type: string
          description: What a reader sees.
        instrument_count:
          type: integer
          description: >
            How many instruments in the curated universe hold this classification. A client may
            use it to explain an empty result before issuing the request.

    FeatureRun:
      type: object
      required:
        [id, kind, status, started_at, finished_at, instrument_count, value_count, failed_count]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [full, incremental, definition] }
        status: { type: string, enum: [running, succeeded, partial, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        instrument_count: { type: integer }
        value_count: { type: integer }
        failed_count:
          type: integer
          description: Instruments whose computation failed and whose previous values still stand.
        trigger_run_id:
          type: [string, "null"]
          format: uuid
          description: The import run an incremental pass followed.
        definition_name:
          type: [string, "null"]
          description: The definition a definition run recomputed.
        app_version: { type: [string, "null"] }

    ListingRow:
      type: object
      description: >
        Unchanged from feature 005 as amended by 013, except that `sector` now carries a code
        from the vocabulary and is never null, and `sector_name` carries what to display.
      required: [id, ticker, name, sector, sector_name]
      properties:
        id: { type: string, format: uuid }
        ticker: { type: string }
        name: { type: string }
        sector:
          type: string
          description: A code from /instruments/sectors. Never null; `unclassified` is a value.
        sector_name:
          type: string
          description: The display name for that code.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
